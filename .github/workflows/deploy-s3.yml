name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push cancels the older one.
concurrency:
  group: deploy-s3
  cancel-in-progress: true

permissions:
  contents: read

env:
  S3_BUCKET: neuhaus-website

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets (_astro/*) can be cached for a year.
      - name: Upload static assets
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "*.html" --exclude "sitemap*.xml" --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"

      # Pages and sitemaps must always be fresh.
      - name: Upload pages
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete --exclude "*" --include "*.html" --include "sitemap*.xml" --include "robots.txt" \
            --cache-control "public,max-age=0,must-revalidate"
